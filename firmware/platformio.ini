; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html
;
; Board: Arduino UNO R4 WiFi (from my starter kit).
;
; Environments (pick one in the PlatformIO toolbar, or use -e on the CLI):
;   uno_r4_wifi       main rover firmware (src/main.cpp)
;   test_motors       spin each motor through the TB6612FNG
;   test_encoders     count pulses from the LM393 speed sensors
;   test_ultrasonic   print HC-SR04 distance readings
;
; CLI example:  pio run -e test_motors -t upload && pio device monitor

[platformio]
default_envs = uno_r4_wifi

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

[env:uno_r4_wifi]
build_src_filter = +<*> -<tests/>

[env:test_motors]
build_src_filter = +<tests/motor_test.cpp>

[env:test_encoders]
build_src_filter = +<tests/encoder_test.cpp>

[env:test_ultrasonic]
build_src_filter = +<tests/ultrasonic_test.cpp>
